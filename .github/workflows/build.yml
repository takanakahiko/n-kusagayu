name: build

on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install Deps
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit src/index.ts
      - name: Build
        run: npm run build
